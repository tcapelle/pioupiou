<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 650" role="img" aria-labelledby="title description">
  <title id="title">Observation stations around Lac du Bourget</title>
  <desc id="description">Map of the Grand Port OpenWindMap wind sensor and the Chambéry–Aix, Belley, Novalaise, and Mont du Chat Météo-France stations.</desc>
  <defs>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f5ed"/>
      <stop offset="1" stop-color="#edf2e8"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#bfe5ef"/>
      <stop offset="1" stop-color="#69b7d0"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#577b97"/>
    </marker>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#18343f" flood-opacity="0.2"/>
    </filter>
    <style>
      .label { font: 600 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #16323c; }
      .detail { font: 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #53666b; }
      .place { font: italic 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #718085; }
      .callout { fill: none; stroke: #728489; stroke-width: 1.4; }
      .temperature { fill: #d26742; stroke: white; stroke-width: 3; }
      .weather { fill: #e8a12d; stroke: white; stroke-width: 3; }
      .wind { fill: #277ba0; stroke: white; stroke-width: 3; }
    </style>
  </defs>

  <rect width="760" height="650" rx="18" fill="url(#land)"/>

  <!-- Westerly terrain context. -->
  <path d="M 285 38 C 340 120 323 204 365 278 S 344 442 405 608" fill="none" stroke="#c9d5c1" stroke-width="18" opacity="0.45"/>
  <path d="M 305 38 C 360 125 342 205 386 282 S 365 445 424 608" fill="none" stroke="#aebfa8" stroke-width="2" opacity="0.75"/>
  <path d="M 326 38 C 378 129 363 207 406 284 S 387 447 447 608" fill="none" stroke="#bdcbb7" stroke-width="1.5" opacity="0.7"/>

  <!-- Lac du Bourget, simplified from OpenStreetMap relation 74445. -->
  <path d="M 434.9,73.1 L 423.3,82.0 L 423.9,90.7 L 427.8,92.8 L 424.6,94.3 L 428.0,93.3 L 441.5,122.8 L 446.9,140.7 L 449.4,170.7 L 480.1,245.0 L 489.0,280.0 L 492.3,314.9 L 486.4,334.8 L 484.1,364.2 L 487.0,399.0 L 494.5,399.4 L 493.9,404.8 L 495.5,398.9 L 501.1,401.2 L 500.5,406.4 L 508.4,413.0 L 534.3,417.3 L 524.2,410.2 L 533.7,413.6 L 541.7,400.3 L 539.5,398.4 L 544.2,382.0 L 539.2,371.8 L 543.1,329.9 L 532.3,319.4 L 536.3,317.0 L 531.9,319.1 L 524.9,301.4 L 526.0,296.8 L 525.2,300.6 L 529.7,299.0 L 526.0,296.1 L 530.6,290.4 L 527.4,289.4 L 537.1,281.3 L 524.3,260.5 L 518.6,257.8 L 520.8,254.2 L 516.9,234.4 L 520.9,226.1 L 532.0,230.5 L 538.8,221.6 L 529.8,228.6 L 537.0,224.0 L 536.8,216.3 L 517.8,184.5 L 505.1,173.6 L 504.0,154.0 L 477.9,84.4 L 464.1,84.2 L 461.2,88.7 L 456.9,79.0 L 441.9,70.8 Z" fill="url(#lake)" stroke="#3f93ae" stroke-width="2" filter="url(#shadow)"/>
  <text x="488" y="190" text-anchor="middle" transform="rotate(76 488 190)" class="label" fill="#276f88" opacity="0.82">Lac du Bourget</text>

  <!-- The phenomenon of interest: air arriving from the west. -->
  <path d="M 75 276 C 185 265 292 278 405 276" fill="none" stroke="#577b97" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <text x="78" y="255" class="label" fill="#577b97">Westerly flow</text>
  <text x="78" y="271" class="detail">the Traverse signal</text>

  <!-- Belley: temperature-only feature station. -->
  <path d="M 224 152 L 160 120 L 42 120" class="callout"/>
  <rect x="216" y="144" width="16" height="16" rx="3" class="temperature"/>
  <text x="42" y="98" class="label">Belley</text>
  <text x="42" y="114" class="detail">Météo-France · 330 m</text>

  <!-- Mont du Chat: temperature-only ridge station. -->
  <path d="M 430 391 L 356 367 L 178 367" class="callout"/>
  <rect x="422" y="383" width="16" height="16" rx="3" class="temperature"/>
  <text x="178" y="345" class="label">Mont du Chat</text>
  <text x="178" y="361" class="detail">Météo-France · ridge · 1,496 m</text>

  <!-- Novalaise: temperature-only feature station. -->
  <path d="M 361 530 L 300 557 L 122 557" class="callout"/>
  <rect x="353" y="522" width="16" height="16" rx="3" class="temperature"/>
  <text x="122" y="535" class="label">Novalaise</text>
  <text x="122" y="551" class="detail">Météo-France · 460 m</text>

  <!-- Grand Port: target wind sensor. -->
  <path d="M 525 300 L 558 280" class="callout"/>
  <circle cx="525" cy="300" r="10" class="wind"/>
  <path d="M 519 304 L 531 296 M 526 295 L 531 296 L 529 301" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="570" y="250" class="label">Grand Port</text>
  <text x="570" y="266" class="detail">Aix-les-Bains · OpenWindMap</text>
  <text x="570" y="282" class="detail">wind · station 2176</text>

  <!-- Chambéry–Aix: primary full-weather and hot-day station. -->
  <path d="M 517 433 L 558 457" class="callout"/>
  <circle cx="517" cy="433" r="10" class="weather"/>
  <circle cx="517" cy="433" r="3" fill="white"/>
  <text x="570" y="427" class="label">Chambéry–Aix</text>
  <text x="570" y="443" class="detail">airport · Météo-France · 235 m</text>
  <text x="570" y="459" class="detail">full weather + daily maximum</text>

  <text x="553" y="326" class="place">Aix-les-Bains</text>
  <text x="548" y="405" class="place">Le Bourget-du-Lac</text>
  <text x="550" y="548" class="place">Chambéry</text>

  <!-- Legend and orientation. -->
  <g transform="translate(40 590)">
    <circle cx="8" cy="8" r="8" class="wind"/>
    <text x="24" y="13" class="detail">target wind</text>
    <circle cx="133" cy="8" r="8" class="weather"/>
    <text x="149" y="13" class="detail">full weather + daily max</text>
    <rect x="309" y="0" width="16" height="16" rx="3" class="temperature"/>
    <text x="333" y="13" class="detail">temperature summaries</text>
  </g>
  <g transform="translate(687 38)">
    <path d="M 12 35 L 12 4 M 6 12 L 12 4 L 18 12" fill="none" stroke="#324b53" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="12" y="51" text-anchor="middle" class="label">N</text>
  </g>
  <g transform="translate(620 606)">
    <path d="M 0 0 H 99" stroke="#324b53" stroke-width="3"/>
    <path d="M 0 -5 V 5 M 99 -5 V 5" stroke="#324b53" stroke-width="2"/>
    <text x="0" y="19" class="detail">0</text>
    <text x="99" y="19" text-anchor="end" class="detail">5 km</text>
  </g>
  <text x="40" y="635" class="detail" font-size="10">Shoreline © OpenStreetMap contributors · ODbL</text>
</svg>
